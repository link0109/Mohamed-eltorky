<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد التركي | EL TORKY Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-blur: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.2);
            --gold: #d4af37;
        }

        body {
            margin: 0; font-family: 'Montserrat', 'Cairo', sans-serif;
            background: #0f0f0f url('background.jpeg') no-repeat center center/cover fixed;
            display: flex; justify-content: center;
        }

        .overlay {
            backdrop-filter: blur(15px) saturate(160%); -webkit-backdrop-filter: blur(15px) saturate(160%);
            background: rgba(0, 0, 0, 0.7); width: 100%; min-height: 100vh;
            padding: 40px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
        }

        .profile { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); margin-bottom: 20px; }
        .brand-container { text-align: center; margin-bottom: 30px; }
        .brand-name { font-family: 'Cinzel', serif; color: #fff; font-size: 32px; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        .brand-sub { color: var(--gold); font-size: 11px; letter-spacing: 6px; text-transform: uppercase; margin-top: 5px; }

        .button {
            display: flex; align-items: center; background: var(--bg-blur);
            border: 1px solid var(--border-color); color: white;
            text-decoration: none; margin: 8px 0; width: 100%; max-width: 360px;
            border-radius: 12px; padding: 6px; transition: 0.3s; cursor: pointer;
        }

        .icon-box { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 18px; color: #fff; }
        .btn-text { flex-grow: 1; text-align: center; font-size: 15px; padding-right: 42px; }

        .fb .icon-box { background: #1877F2; }
        .ig .icon-box { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .tk .icon-box { background: #000; border: 1px solid rgba(255,255,255,0.2); }
        .wa .icon-box { background: #25D366; }
        .call .icon-box { background: #444; }
        .vfcash .icon-box { background: var(--gold); color: #000; }
        
        /* Modals Styling */
        #payment-selection-modal, #vfcash-modal, #orange-cash-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 5000; justify-content: center; align-items: center;
        }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 85%; max-width: 380px; text-align: center; color: white; }
        
        input { 
            width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; 
            background: #000; color: white; border: 1px solid #333; 
            box-sizing: border-box; font-family: 'Cairo', sans-serif; font-size: 18px; outline: none; text-align: center;
        }

        .confirm-btn { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .pay-option-btn { display: block; width: 100%; padding: 15px; margin: 12px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .vf-style { background: #e60000; color: white; }
        .orange-style { background: #ff6600; color: white; }
        .insta-style { background: white; color: black; }

        .footer-copyrights { margin-top: auto; padding: 30px 0; text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="overlay">
    <img src="profile.jpg" class="profile" alt="EL TORKY">
    <div class="brand-container">
        <h1 class="brand-name">EL TORKY</h1>
        <div class="brand-sub">Professional Photographer</div>
    </div>

    <!-- التواصل الاجتماعي كاملة -->
    <a class="button fb" href="https://www.facebook.com/share/187a3beKHT/" target="_blank">
        <div class="icon-box"><i class="fas fa-user-circle"></i></div><div class="btn-text">Personal Profile</div>
    </a>

    <a class="button fb" href="https://www.facebook.com/share/1dk5VXaDCu/?mibextid=wwXIfr" target="_blank">
        <div class="icon-box"><i class="fab fa-facebook-f"></i></div><div class="btn-text">Facebook Page</div>
    </a>

    <a class="button ig" href="https://www.instagram.com/el_torky_photography" target="_blank">
        <div class="icon-box"><i class="fab fa-instagram"></i></div><div class="btn-text">Instagram</div>
    </a>

    <a class="button tk" href="https://www.tiktok.com/@eltorky23" target="_blank">
        <div class="icon-box"><i class="fab fa-tiktok"></i></div><div class="btn-text">TikTok</div>
    </a>

    <a class="button wa" href="https://wa.me/201024486602" target="_blank">
        <div class="icon-box"><i class="fab fa-whatsapp"></i></div><div class="btn-text">WhatsApp</div>
    </a>

    <div class="button call" onclick="window.location.href='tel:01024486602'">
        <div class="icon-box"><i class="fas fa-phone-alt"></i></div><div class="btn-text">اتصل بنا | Call Me</div>
    </div>

    <div class="button vfcash" onclick="openPaymentSelection()">
        <div class="icon-box"><i class="fas fa-money-bill-wave"></i></div><div class="btn-text">تحويل المبلغ | Transfer</div>
    </div>

    <div class="footer-copyrights">© EL TORKY Photographer</div>
</div>

<!-- مودالات الدفع (نفس كود المقدم بالظبط) -->
<div id="payment-selection-modal">
    <div class="modal-content">
        <h3 style="color:var(--gold); margin-bottom: 20px;">اختر وسيلة التحويل</h3>
        <button class="pay-option-btn vf-style" onclick="showVFCashPage()">فودافون كاش | Vodafone Cash</button>
        <button class="pay-option-btn orange-style" onclick="showOrangeCashPage()">أورنج كاش | Orange Cash</button>
        <button class="pay-option-btn insta-style" onclick="handleInstaPay()">إنستا باي | InstaPay</button>
        <p onclick="closePaymentSelection()" style="color:#888; cursor:pointer; margin-top:15px;">إغلاق</p>
    </div>
</div>

<div id="vfcash-modal">
    <div class="modal-content">
        <h3 style="color:#e60000; margin-bottom: 20px;">فودافون كاش</h3>
        <input type="text" inputmode="decimal" id="cash-amount" placeholder="أدخل المبلغ هنا">
        <button class="confirm-btn" onclick="makeVFCashCall()" style="background:#e60000; color:white;">اتصال وتحويل الآن</button>
        <p onclick="closeVFCash()" style="color:#888; cursor:pointer; margin-top:20px;">إغلاق</p>
    </div>
</div>

<div id="orange-cash-modal">
    <div class="modal-content">
        <h3 style="color:#ff6600; margin-bottom: 20px;">أورنج كاش</h3>
        <input type="text" inputmode="decimal" id="orange-amount" placeholder="أدخل المبلغ هنا">
        <button class="confirm-btn" onclick="makeOrangeCashCall()" style="background:#ff6600; color:white;">اتصال وتحويل الآن</button>
        <p onclick="closeOrangeCash()" style="color:#888; cursor:pointer; margin-top:20px;">إغلاق</p>
    </div>
</div>

<script>
function convertNumbers(str) {
    const arabicNums = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
    for (let i = 0; i < 10; i++) { str = str.replace(arabicNums[i], i); }
    return str;
}

function openPaymentSelection() { document.getElementById('payment-selection-modal').style.display = 'flex'; }
function closePaymentSelection() { document.getElementById('payment-selection-modal').style.display = 'none'; }
function showVFCashPage() { closePaymentSelection(); document.getElementById('vfcash-modal').style.display = 'flex'; }
function showOrangeCashPage() { closePaymentSelection(); document.getElementById('orange-cash-modal').style.display = 'flex'; }
function closeOrangeCash() { document.getElementById('orange-cash-modal').style.display = 'none'; }
function closeVFCash() { document.getElementById('vfcash-modal').style.display = 'none'; }

function handleInstaPay() {
    window.location.href = "https://instapay.me/S/el.torky/instapay"; // ضع رابط الانستا باي الخاص بك هنا
}

function makeVFCashCall() {
    let amount = document.getElementById('cash-amount').value;
    amount = convertNumbers(amount); 
    if(!amount) { alert("يرجى كتابة المبلغ أولاً"); return; }
    const phoneNumber = "01024486602"; // رقم فودافون كاش الخاص بك
    const ussd = `*9*7*${phoneNumber}*${amount}%23`;
    window.location.href = `tel:${ussd}`;
    closeVFCash();
}

function makeOrangeCashCall() {
    let amount = document.getElementById('orange-amount').value;
    amount = convertNumbers(amount); 
    if(!amount) { alert("يرجى كتابة المبلغ أولاً"); return; }
    const myNumber = "01221193309"; // رقم أورنج كاش الخاص بك
    const ussd = `%237115*7*${amount}*${myNumber}%23`;
    window.location.href = `tel:${ussd}`;
    closeOrangeCash();
}
</script>
</body>
</html>
