<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد التركي | EL TORKY Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-blur: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.2);
            --gold: #d4af37;
        }

        body {
            margin: 0; font-family: 'Montserrat', 'Cairo', sans-serif;
            background: #0f0f0f url('background.jpeg') no-repeat center center/cover fixed;
            display: flex; justify-content: center; overflow-x: hidden;
        }

        .overlay {
            backdrop-filter: blur(15px) saturate(160%); -webkit-backdrop-filter: blur(15px) saturate(160%);
            background: rgba(0, 0, 0, 0.7); width: 100%; min-height: 100vh;
            padding: 40px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
        }

        .profile { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); margin-bottom: 20px; }
        .brand-container { text-align: center; margin-bottom: 30px; }
        .brand-name { font-family: 'Cinzel', serif; color: #fff; font-size: 32px; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        .brand-sub { color: var(--gold); font-size: 11px; letter-spacing: 6px; text-transform: uppercase; margin-top: 5px; }

        /* الأزرار الرئيسية */
        .button {
            display: flex; align-items: center; background: var(--bg-blur);
            border: 1px solid var(--border-color); color: white;
            text-decoration: none; margin: 8px 0; width: 100%; max-width: 360px;
            border-radius: 12px; padding: 6px; transition: 0.3s; cursor: pointer;
        }
        .icon-box { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 18px; color: #fff; }
        .btn-text { flex-grow: 1; text-align: center; font-size: 15px; padding-right: 42px; }

        .fb .icon-box { background: #1877F2; }
        .ig .icon-box { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .tk .icon-box { background: #000; border: 1px solid rgba(255,255,255,0.2); }
        .wa .icon-box { background: #25D366; }
        .call .icon-box { background: #444; }
        .vfcash .icon-box { background: var(--gold); color: #000; }

        /* القوائم */
        #main-view, #packages-view { width: 100%; display: flex; flex-direction: column; align-items: center; }
        #packages-view { display: none; }

        /* مودال الدفع (نفس تصميم الصورة) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #121212; border: 2px solid var(--gold); border-radius: 25px;
            width: 90%; max-width: 400px; padding: 30px 20px; position: relative; text-align: center;
        }
        .modal-title { color: var(--gold); font-size: 22px; font-weight: bold; margin-bottom: 25px; font-family: 'Cairo', sans-serif; }
        
        .pay-btn {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none;
            font-weight: bold; font-size: 16px; cursor: pointer; color: white; display: block; text-decoration: none;
        }
        .btn-vodafone { background: #e60000; }
        .btn-orange { background: #ff6600; }
        .btn-instapay { background: #fff; color: #000; }
        .close-modal { color: #888; background: none; border: none; margin-top: 20px; cursor: pointer; font-size: 18px; }

        /* واجهة إدخال المبلغ */
        .amount-view { display: none; text-align: center; }
        input[type="number"] {
            width: 80%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--gold);
            background: #222; color: #fff; text-align: center; font-size: 20px;
        }

        .footer-copyrights { margin-top: auto; padding: 30px 0; text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="overlay">
    <img src="profile.jpg" class="profile" alt="EL TORKY">
    <div class="brand-container">
        <h1 class="brand-name">EL TORKY</h1>
        <div class="brand-sub">Professional Photographer</div>
    </div>

    <div id="main-view">
        <div class="button" style="border: 2px solid var(--gold);" onclick="showPackages()">
            <div class="icon-box" style="background:var(--gold); color:black;"><i class="fas fa-tags"></i></div>
            <div class="btn-text">الأسعار والبكدجات | Prices</div>
        </div>

        <!-- السوشيال ميديا كاملة -->
        <a class="button fb" href="https://www.facebook.com/share/1dk5VXaDCu/?mibextid=wwXIfr" target="_blank">
            <div class="icon-box"><i class="fab fa-facebook-f"></i></div><div class="btn-text">Facebook Page</div>
        </a>
        <a class="button ig" href="https://www.instagram.com/el_torky_photography" target="_blank">
            <div class="icon-box"><i class="fab fa-instagram"></i></div><div class="btn-text">Instagram</div>
        </a>
        <a class="button tk" href="https://www.tiktok.com/@eltorky23" target="_blank">
            <div class="icon-box"><i class="fab fa-tiktok"></i></div><div class="btn-text">TikTok</div>
        </a>
        <a class="button wa" href="https://wa.me/201024486602" target="_blank">
            <div class="icon-box"><i class="fab fa-whatsapp"></i></div><div class="btn-text">WhatsApp</div>
        </a>
        <div class="button call" onclick="window.location.href='tel:01024486602'">
            <div class="icon-box"><i class="fas fa-phone-alt"></i></div><div class="btn-text">اتصل بنا | Call Me</div>
        </div>
        <div class="button vfcash" onclick="openPaymentModal()">
            <div class="icon-box"><i class="fas fa-money-bill-wave"></i></div><div class="btn-text">تحويل المبلغ | Transfer</div>
        </div>
    </div>

    <!-- مودال اختيار وسيلة التحويل -->
    <div id="payment-modal" class="modal">
        <div class="modal-content" id="method-selector">
            <div class="modal-title">اختر وسيلة التحويل</div>
            <button class="pay-btn btn-vodafone" onclick="showAmountInput('vodafone')">Vodafone Cash | فودافون كاش</button>
            <button class="pay-btn btn-orange" onclick="showAmountInput('orange')">Orange Cash | أورنج كاش</button>
            <button class="pay-btn btn-instapay" onclick="copyInsta()">InstaPay | إنستا باي</button>
            <button class="close-modal" onclick="closePaymentModal()">إغلاق</button>
        </div>

        <!-- واجهة إدخال المبلغ -->
        <div class="modal-content amount-view" id="amount-input-view">
            <div class="modal-title" id="provider-title">إدخال المبلغ</div>
            <p style="color:#ccc; font-size:14px;">اكتب المبلغ المراد تحويله</p>
            <input type="number" id="amount-value" placeholder="0.00">
            <button class="pay-btn btn-vodafone" style="background:var(--gold); color:black;" onclick="executeUSSD()">إرسال الآن</button>
            <button class="close-modal" onclick="backToMethods()">رجوع</button>
        </div>
    </div>

    <div class="footer-copyrights">© EL TORKY Photographer</div>
</div>

<script>
let currentProvider = '';

function showPackages() { /* دالة عرض البكدجات كما هي في الكود السابق */ }
function openPaymentModal() { document.getElementById('payment-modal').style.display='flex'; }
function closePaymentModal() { document.getElementById('payment-modal').style.display='none'; backToMethods(); }

function showAmountInput(provider) {
    currentProvider = provider;
    document.getElementById('method-selector').style.display = 'none';
    document.getElementById('amount-input-view').style.display = 'block';
    document.getElementById('provider-title').innerText = provider === 'vodafone' ? 'فودافون كاش' : 'أورنج كاش';
}

function backToMethods() {
    document.getElementById('method-selector').style.display = 'block';
    document.getElementById('amount-input-view').style.display = 'none';
}

function executeUSSD() {
    const amount = document.getElementById('amount-value').value;
    if(!amount || amount <= 0) { alert("من فضلك أدخل مبلغ صحيح"); return; }
    
    let ussdCode = '';
    if(currentProvider === 'vodafone') {
        // كود فودافون: *9*7*الرقم*المبلغ#
        ussdCode = `*9*7*01024486602*${amount}%23`;
    } else {
        // كود أورنج: #115*1*الرقم*المبلغ*رقمك_السري# (سيطلب الرقم السري من العميل)
        ussdCode = `*115*1*01221193309*${amount}%23`;
    }
    window.location.href = `tel:${ussdCode}`;
}

function copyInsta() {
    navigator.clipboard.writeText('el.torky@instapay');
    alert("تم نسخ عنوان InstaPay: el.torky@instapay");
}
</script>
</body>
</html>
